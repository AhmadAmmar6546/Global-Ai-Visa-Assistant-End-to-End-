name: Validate application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: visa
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: visa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visa -d visa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://visa:integration_only@localhost:5432/visa_test?schema=public
      APP_URL: http://localhost:3000
      AI_PROVIDER: local
      TEST_BASE_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run test:deployment
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local test app
        run: |
          npm run dev > /tmp/visa-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/visa-app.log
          exit 1
      - run: npm run test:integration
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
